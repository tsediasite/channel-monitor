name: Channel Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install python-telegram-bot==20.7

      - name: Restore state
        uses: actions/cache@v3
        with:
          path: state.json
          key: subscriber-state

      - name: Run monitor
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          THRESHOLD: ${{ secrets.THRESHOLD }}
        run: python monitor.py

      - name: Save state
        uses: actions/cache@v3
        with:
          path: state.json
          key: subscriber-state
